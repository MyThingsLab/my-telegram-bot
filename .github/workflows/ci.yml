name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

# Supersede in-flight runs when an agent pushes again to the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Skip while a PR is a draft; always run on pushes to main.
    if: ${{ github.event_name == 'push' || github.event.pull_request.draft == false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # Sibling repos, not on PyPI — pull them from the same owner.
      - name: Install siblings
        run: |
          pip install "my-things-core @ git+https://github.com/${{ github.repository_owner }}/my-things-core@main"
          pip install "my-guard @ git+https://github.com/${{ github.repository_owner }}/my-guard@main"
          # my-idea@main now depends on my-librarian, which is not on PyPI, so pip
          # cannot resolve it from the git URL alone. Install it first.
          pip install --no-deps "my-librarian @ git+https://github.com/${{ github.repository_owner }}/my-librarian@main"
          pip install "my-idea @ git+https://github.com/${{ github.repository_owner }}/my-idea@main"
          pip install "my-notes @ git+https://github.com/${{ github.repository_owner }}/my-notes@main"
          pip install "my-guide @ git+https://github.com/${{ github.repository_owner }}/my-guide@main"
      - name: Install
        run: pip install -e ".[dev]"
      - name: Ruff
        run: ruff check src tests
      - name: Tests
        run: pytest --cov=mytelegrambot --cov-report=xml
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: ${{ github.repository }}
